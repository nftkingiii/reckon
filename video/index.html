<!doctype html>
<!-- Reckon walkthrough film. A seek(t) film: every frame is a pure function of t. No transitions, timers, Math.random or carried state. -->
<html><head><meta charset="utf-8"><title>Reckon walkthrough</title>
<style>
@font-face{font-family:"Public Sans";src:url("assets/fonts/public-sans.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Plex Mono";src:url("assets/fonts/plex-mono-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Plex Mono";src:url("assets/fonts/plex-mono-500.woff2") format("woff2");font-weight:500 700}
html,body{margin:0;background:#0b1017}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script src="lib/motion.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const L = layout(W, H), u = L.u, P = L.portrait;
// 16:9 master. Start times (bar = 2.4 s). The 9:16 cut re-uses shots as segments [shot, from, to] in that shot's own time.
const FROM = { s01: 0, s02: 4.8, s03: 9.6, s04: 16.8, s05: 24.0, s06: 36.0, s07: 48.0, s08: 52.8, s09: 60.0, s10: 69.6, s11: 79.2, s12: 91.2 };
const END = 98.4;
const VSEG = [['s01', 0, 4.8], ['s06', 0, 7.2], ['s08', 0, 7.2], ['s11', 0, 7.2], ['s12', 0, 3.6]];
const VDUR = VSEG.reduce((a, s) => a + s[2] - s[1], 0);
window.FILM = { w: W, h: H, dur: P ? VDUR : END, fps: 30 };
// Placeholders for beats still to be captured from the live site. Set false only after the real capture is wired in.
const PENDING = { usdyInv: false, holdings: false };

// Reckon's own palette (web/style.css)
const C = { bg: '#0b1017', panel: '#111823', panel2: '#161f2c', line: 'rgba(160,185,215,0.22)', ink: '#e4eaf2', mute: '#9aa9bd', dim: '#75869b',
  accent: '#6c9cff', pass: '#46c2a3', flag: '#ff7357', hold: '#8b9bb3', red: '#ff3b3b' };
const F = { d: '"Public Sans", system-ui, sans-serif', m: '"Plex Mono", ui-monospace, monospace' };

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const IMG = {};
const NAMES = ['assets', 'how-top', 'ustb-top', 'ustb-supply', 'ustb-nav', 'ustb-filings', 'ustb-sanctions', 'ustb-tg', 'buidl-issuer', 'usdy-top', 'usdy-flag1', 'usdy-flag2', 'frontier', 'holdings-both', 'usdy-doc'];
function img(name) { const i = new Image(); i.src = `assets/cap/${name}.png`; IMG[name] = i; return i.decode().catch(() => { IMG[name] = null; console.warn('missing ' + name); }); }
window.ready = Promise.all([
  ...[400, 500, 600, 700].map(w => document.fonts.load(`${w} 100px "Public Sans"`)),
  ...[400, 500].map(w => document.fonts.load(`${w} 100px "Plex Mono"`)),
  ...NAMES.map(img),
]);

// ---------- helpers
function text(str, x, y, size, o = {}) {
  g.save(); g.font = `${o.weight || 500} ${size}px ${o.font || F.d}`; g.fillStyle = o.color || C.ink;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'middle'; g.globalAlpha *= o.alpha ?? 1;
  if (o.track) g.letterSpacing = o.track + 'px';
  g.fillText(str, x, y); g.restore();
}
function tw(str, size, font = F.d, weight = 500) { g.save(); g.font = `${weight} ${size}px ${font}`; const w = g.measureText(str).width; g.restore(); return w; }
function wrap(str, size, maxW, font = F.d, weight = 500) {
  g.save(); g.font = `${weight} ${size}px ${font}`; const out = []; let cur = '';
  for (const w of str.split(' ')) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); g.restore(); return out;
}
function para(str, x, y, size, maxW, o = {}) { const ls = wrap(str, size, maxW, o.font, o.weight); ls.forEach((l, i) => text(l, x, y + i * size * (o.lh || 1.3), size, o)); return ls.length * size * (o.lh || 1.3); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function fit(str, size, maxW, font = F.d, weight = 700) { let s = size; while (s > 14 && tw(str, s, font, weight) > maxW) s -= 2; return s; }
const ap = (lt, t0, d = .35) => easeOut(seg(lt, t0, t0 + d));
const out = (lt, t1, d = .2) => 1 - seg(lt, t1, t1 + d);
const win = (lt, a, b) => Math.min(ap(lt, a), out(lt, b));
function chip(str, x, y, color, o = {}) {   // honesty label; x = left, y = centre
  const s = (o.size || 21) * u, w = tw(str, s, F.m, 500) + 30 * u, h = s * 1.9;
  g.save(); g.globalAlpha *= o.alpha ?? 1; rr(x, y - h / 2, w, h, 6 * u); g.fillStyle = 'rgba(11,16,23,.94)'; g.fill(); g.strokeStyle = color; g.lineWidth = 2 * u; g.stroke(); g.restore();
  text(str, x + 15 * u, y + 1 * u, s, { font: F.m, weight: 500, color, alpha: o.alpha }); return w;
}
function caption(str, lt, a, b, o = {}) {
  const k = win(lt, a, b); if (k <= 0) return;
  const size = (o.size || (P ? 40 : 38)) * u, maxW = P ? W - 2 * L.safe.side : Math.min(W * .78, 1500 * u);
  const ls = wrap(str, size, maxW - 70 * u, F.d, 500), lh = size * 1.28, w = Math.max(...ls.map(l => tw(l, size))) + 60 * u, h = ls.length * lh + 30 * u;
  const y = (o.y ?? (P ? H - L.safe.bottom - h + 10 * u : H - 44 * u - h)) + (1 - k) * 20 * u;
  g.save(); g.globalAlpha = k; rr(W / 2 - w / 2, y, w, h, 10 * u); g.fillStyle = 'rgba(11,16,23,.96)'; g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.5 * u; g.stroke(); g.restore();
  ls.forEach((l, i) => text(l, W / 2, y + 15 * u + lh * (i + .5), size, { align: 'center', alpha: k, color: o.color || C.ink }));
}
function mark(x, y, s, k = 1, kBar = 1) {  // Reckon's mark: three bars and the accent crossbar. x,y = top-left, s = size of the 24-unit box
  const f = s / 24; g.save(); g.translate(x, y); g.scale(f, f); g.lineCap = 'butt';
  g.strokeStyle = C.ink; g.lineWidth = 1.5; g.globalAlpha = k;
  [6, 12, 18].forEach((bx, i) => { const kk = clamp(k * 3 - i * .6); g.beginPath(); g.moveTo(bx, 4); g.lineTo(bx, 4 + 16 * kk); g.stroke(); });
  g.strokeStyle = C.accent; g.lineWidth = 2; g.globalAlpha = 1; g.beginPath(); g.moveTo(3, 14); g.lineTo(3 + 18 * kBar, 14); g.stroke(); g.restore();
}

// ---------- panel view of a real capture. cam = {cx, cy, w} in the capture's CSS px (PNG is 2x)
function view(name, cam, d, o = {}) {
  const im = IMG[name]; g.save(); rr(d.x, d.y, d.w, d.h, 12 * u); g.clip(); g.fillStyle = C.bg; g.fillRect(d.x, d.y, d.w, d.h);
  if (!im) { g.restore(); return null; }
  const iw = im.naturalWidth / 2, ih = im.naturalHeight / 2, s = d.w / cam.w;
  if (ih * s < d.h) { const nh = ih * s; d = { x: d.x, y: d.y + (d.h - nh) / 2, w: d.w, h: nh }; g.restore(); g.save(); rr(d.x, d.y, d.w, d.h, 12 * u); g.clip(); }
  const sh = d.h / s;
  let sx = cam.cx - cam.w / 2, sy = cam.cy - sh / 2;
  sx = clamp(sx, Math.min(0, iw - cam.w), Math.max(0, iw - cam.w)); sy = ih > sh ? clamp(sy, 0, ih - sh) : (ih - sh) / 2;
  g.drawImage(im, sx * 2, sy * 2, cam.w * 2, sh * 2, d.x, d.y, d.w, d.h);
  g.restore();
  const T = { sx, sy, s, map: (x, y, w, h) => ({ x: d.x + (x - sx) * s, y: d.y + (y - sy) * s, w: w * s, h: h * s }) };
  g.save(); rr(d.x, d.y, d.w, d.h, 12 * u); g.strokeStyle = C.line; g.lineWidth = 1.5 * u; g.stroke(); g.restore();
  return T;
}
function hbox(T, d, box, color, k = 1) {   // highlight box in capture px, clipped to the panel; no glow
  if (!T || k <= 0) return; const b = T.map(box.x, box.y, box.w, box.h);
  g.save(); rr(d.x, d.y, d.w, d.h, 12 * u); g.clip(); g.globalAlpha = k; g.strokeStyle = color; g.lineWidth = 3 * u;
  g.beginPath(); g.roundRect(b.x - 6 * u, b.y - 5 * u, b.w + 12 * u, b.h + 10 * u, 6 * u); g.stroke();
  g.globalAlpha = k * .08; g.fillStyle = color; g.fill(); g.restore();
}
const DEST = () => P ? { x: 40 * u, y: 150 * u, w: W - 80 * u, h: 860 * u } : { x: 60 * u, y: 56 * u, w: 1180 * u, h: 780 * u };
function callout(lt, c) {   // one card at a time. c = {t0, t1, k, v, s, col}
  const a = ap(lt, c.t0, .4) * out(lt, c.t1, .2); if (a <= 0) return;
  const d = DEST(), x = P ? 40 * u : 1290 * u, w = P ? W - 80 * u : 570 * u, y = P ? d.y + d.h + 36 * u : d.y + d.h / 2 - ((130 * u + wrap(c.s || '', (27 * u), 510 * u).length * 27 * u * 1.32 + 30 * u) / 2);
  const sv = fit(c.v, (P ? 76 : 70) * u, w - 60 * u, F.d, 700), sub = (P ? 29 : 27) * u;
  const lines = wrap(c.s || '', sub, w - 60 * u), h = (P ? 120 : 130) * u + lines.length * sub * 1.32 + 30 * u + (c.s ? 0 : -40 * u);
  g.save(); g.globalAlpha = a; g.translate((P ? 0 : 36 * u) * (1 - a), (P ? 24 * u : 0) * (1 - a));
  rr(x, y, w, h, 10 * u); g.fillStyle = C.panel; g.fill(); g.strokeStyle = c.col || C.accent; g.lineWidth = 2.5 * u; g.stroke();
  text(c.k, x + 30 * u, y + 40 * u, 21 * u, { font: F.m, weight: 500, color: c.col || C.accent });
  text(c.v, x + 30 * u, y + 100 * u, sv, { weight: 700 });
  lines.forEach((l, i) => text(l, x + 30 * u, y + 158 * u + i * sub * 1.32, sub, { color: C.mute }));
  g.restore();
}
function chipsRow(lt, list) {   // honesty chips under the panel
  const d = DEST(); let x = d.x, y = d.y + d.h + (P ? 0 : 36 * u); if (P) return;
  list.forEach(([str, col, t0, t1]) => { if (lt < t0 || lt >= (t1 ?? 1e9)) return; x += chip(str, x, y, col, { size: 20, alpha: ap(lt, t0, .3) }) + 14 * u; });
}
function chipsV(lt, list) {   // portrait: honesty chips just under the callout, above the caption
  if (!P) return; const d = DEST(); let x = 40 * u, y = d.y + d.h + 345 * u;
  list.forEach(([str, col, t0, t1]) => { if (lt < t0 || lt >= (t1 ?? 1e9)) return; const w = tw(str, 22 * u, F.m, 500) + 30 * u; if (x + w > W - 40 * u) { x = 40 * u; y += 56 * u; } x += chip(str, x, y, col, { size: 22, alpha: ap(lt, t0, .3) }) + 12 * u; });
}

// ---------- segment shots: each shot is a list of segments; a segment is one capture, one camera path, highlights, one callout at a time.
// cam keys are [relative t, cx, cy, w]; hl are {t0, t1, box:[x,y,w,h], col}
function segShot(segs, chips, caps) {
  return (lt) => {
    const sg = segs.find(s => lt >= s.t0 && lt < s.t1) || segs[segs.length - 1], rl = lt - sg.t0;
    const d = DEST(), keys = sg.cam.map(k => [k[0], k.slice(1)]);
    let [cx, cy, cw] = trackN(rl, keys, ...(sg.spring || SPRINGS.base));
    if (P) { const nw = Math.max(cw * .62, 400); cx = cx - (cw - nw) * (cx > 600 ? 0 : .5) ; cw = nw; }
    const adj = P && sg.camV ? sg.camV : null;
    const cam = adj ? (() => { const [vx, vy, vw] = trackN(rl, sg.camV.map(k => [k[0], k.slice(1)]), ...SPRINGS.base); return { cx: vx, cy: vy, w: vw }; })() : { cx, cy, w: cw };
    const T = view(sg.img, cam, d);
    (sg.hl || []).forEach(h => hbox(T, d, { x: h.box[0], y: h.box[1], w: h.box[2], h: h.box[3] }, h.col || C.accent, win(rl, h.t0, h.t1)));
    (sg.co || []).forEach(c => callout(rl, c));
    chipsRow(lt, chips); chipsV(lt, chips);
    (caps || []).forEach(c => caption(c[0], lt, c[1], c[2]));
  };
}
const TN = 'live · testnet (Sepolia test USDC)';

const S = {};
// 01 | hook
S.s01 = { draw(lt) {
  const x = P ? 70 * u : 150 * u, y0 = H * (P ? .30 : .30), maxW = W - x * 2;
  const l1 = 'On chain, a token says one thing.', l2 = 'Its issuer says another.';
  const sz = P ? 104 * u : fit(l1, 120 * u, maxW - 30 * u, F.d, 600);
  const n1 = Math.floor(clamp(lt - .3) * 38), n2 = Math.floor(Math.max(0, lt - 1.9) * 36);
  const t1 = l1.slice(0, n1), t2 = l2.slice(0, n2);
  if (P) { para(t1, x, y0, sz, maxW, { weight: 600, lh: 1.15 }); para(t2, x, y0 + 300 * u, sz, maxW, { weight: 600, color: C.flag, lh: 1.15 }); }
  else { text(t1, x, y0, sz, { weight: 600 }); text(t2, x, y0 + 160 * u, sz, { weight: 600, color: C.flag }); }
  const k = ap(lt, 3.3, .5), yq = H * (P ? .66 : .70);
  text('Who checks?', x, yq, (P ? 110 : 150) * u, { weight: 700, color: C.accent, alpha: k, track: -2 });
  const mk = (P ? 120 : 150) * u; mark(W - x - mk, H * (P ? .12 : .12), mk, ap(lt, .1, .8), ap(lt, 3.3, .5));
} };
// 02 | who it is for
S.s02 = { draw(lt) {
  const x = P ? 70 * u : 150 * u;
  para('Built for teams that hold tokenized Treasuries.', x, H * .2, (P ? 72 : 80) * u, W - 2 * x - (P ? 0 : 500 * u), { weight: 700, lh: 1.12, alpha: ap(lt, .1, .4) });
  const rows = [['Asset managers', 'Does the chain match the fund’s own figures?', C.pass], ['Custodians', 'Did a mint authority or the supply change?', C.accent], ['Compliance and risk', 'Is a name sanctioned? Is there a new filing?', C.flag]];
  rows.forEach((r, i) => { const a = ap(lt, 1.0 + i * .6, .4), y = H * (P ? .42 : .50) + i * (P ? 250 : 140) * u;
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 20 * u); g.fillStyle = r[2]; g.fillRect(x, y - 36 * u, 6 * u, (P ? 160 : 100) * u);
    text(r[0], x + 36 * u, y, (P ? 52 : 46) * u, { weight: 700 }); para(r[1], x + 36 * u, y + 62 * u, (P ? 38 : 34) * u, W - x * 2 - 60 * u, { color: C.mute }); g.restore(); });
  chip('who it is built for, not a customer list', x, H * (P ? .86 : .88), C.hold, { size: 20, alpha: ap(lt, 3.0, .4) });
} };
// 03 | assets page
S.s03 = { draw: segShot([{ t0: 0, t1: 7.2, img: 'assets',
  cam: [[0, 640, 566, 1280], [1.4, 640, 316, 1100], [3.6, 640, 495, 1100], [5.6, 916, 842, 620]],
  hl: [{ t0: 1.6, t1: 3.4, box: [96, 265, 1088, 102], col: C.pass }, { t0: 3.8, t1: 5.4, box: [96, 391, 1088, 209] }, { t0: 5.8, t1: 7.0, box: [648, 616, 536, 453], col: C.flag }],
  co: [{ t0: 1.5, t1: 3.5, k: 'LIVE', v: 'Every 15 min', s: 'Two Solana RPCs per mint, then issuer figures, regulators and entities.', col: C.pass },
       { t0: 3.7, t1: 5.5, k: 'SUPERSTATE USTB', v: '12 established', s: '0 flagged · 1 cannot check', col: C.accent },
       { t0: 5.7, t1: 7.1, k: 'ONDO USDY', v: '2 flagged', s: '8 established · 3 cannot check', col: C.flag }] }],
  [[TN, C.pass, 1.5]], [['Three funds. One page. Read every 15 minutes.', .3, 6.9]]) };
// 04 | the checks
S.s04 = { draw: segShot([{ t0: 0, t1: 7.2, img: 'how-top',
  cam: [[0, 640, 430, 1280], [1.0, 430, 450, 800], [3.4, 430, 840, 800]],
  hl: [{ t0: 1.2, t1: 3.2, box: [96, 372, 700, 160] }, { t0: 3.6, t1: 7.0, box: [96, 598, 700, 520] }],
  co: [{ t0: 1.1, t1: 3.3, k: 'THREE STATES', v: 'Cannot check', s: 'is a result of its own. It is never hidden inside a pass.', col: C.hold },
       { t0: 3.5, t1: 7.1, k: 'EVERY ROW', v: 'Read, matched?', s: 'Mint state on two RPCs, issuer figures, SEC filings, GLEIF, sanctions, an independent supply read.', col: C.accent }] }],
  [], [['Every row says what was read, from where, when, and whether it matched.', 3.5, 7.0]]) };
// 05 | what it buys every hour
S.s05 = { draw: segShot([
  { t0: 0, t1: 3.0, img: 'how-top', cam: [[0, 640, 192, 1120]], hl: [{ t0: .2, t1: 2.8, box: [96, 141, 1088, 102], col: C.pass }],
    co: [{ t0: .3, t1: 2.9, k: 'EVERY HOUR', v: '$0.25 a pass', s: 'Capped at $3.50 a day. Spent today $0.14 when captured. Bought through Telegraph escrow.', col: C.pass }] },
  { t0: 3.0, t1: 7.6, img: 'ustb-sanctions', cam: [[0, 380, 160, 760], [2.2, 380, 500, 760]],
    hl: [{ t0: .2, t1: 2.0, box: [0, 0, 1088, 351], col: C.accent }, { t0: 2.4, t1: 4.5, box: [20, 330, 1048, 350], col: C.pass }],
    co: [{ t0: .3, t1: 2.2, k: 'SANCTIONS · 710637', v: '5 names, no match', s: 'Superstate, the trust, the adviser, the custodian, the administrator.', col: C.accent },
         { t0: 2.4, t1: 4.6, k: 'RECEIPT PER NAME', v: '$0.01 each', s: 'Every purchase carries a receipt hash on the row.', col: C.pass }] },
  { t0: 7.6, t1: 9.8, img: 'ustb-filings', cam: [[0, 380, 230, 760]], hl: [],
    co: [{ t0: .2, t1: 2.2, k: 'SEC FILING · 731003', v: 'No new filing', s: 'Newest is 2026-07-14, the same as the latest known.', col: C.accent }] },
  { t0: 9.8, t1: 12.0, img: 'ustb-tg', cam: [[0, 380, 190, 760]], hl: [],
    co: [{ t0: .2, t1: 2.2, k: 'PLUMB · 7310060', v: 'Our own miner', s: 'Reports the same supply as Reckon. A consistency check, not independent proof.', col: C.flag }] },
  ], [[TN, C.pass, .3], ['Plumb is our own miner', C.flag, 9.9]], [['Reckon buys the checks it cannot do itself, and keeps the receipts.', 3.2, 7.4]]) };
// 06 | USTB
S.s06 = { draw: segShot([
  { t0: 0, t1: 3.0, img: 'ustb-top', cam: [[0, 640, 480, 1280], [1.0, 600, 480, 1010]], hl: [{ t0: 1.1, t1: 2.9, box: [96, 428, 1088, 56] }],
    co: [{ t0: 1.0, t1: 2.9, k: 'SUPERSTATE USTB', v: '12 established', s: '0 flagged · 1 cannot check (first snapshot, no diff yet)', col: C.pass }] },
  { t0: 3.0, t1: 6.2, img: 'ustb-supply', cam: [[0, 380, 120, 800], [1.4, 420, 260, 800]], hl: [{ t0: .3, t1: 3.0, box: [0, 0, 1088, 110], col: C.pass }],
    co: [{ t0: .3, t1: 3.1, k: 'CHAIN VS ISSUER', v: 'Exact on 3 networks', s: 'Solana, Ethereum and Plume match the issuer’s own ledger. Not an audit.', col: C.pass }] },
  { t0: 6.2, t1: 8.6, img: 'ustb-nav', cam: [[0, 380, 120, 800]], hl: [{ t0: .3, t1: 2.4, box: [0, 0, 1088, 110], col: C.pass }],
    co: [{ t0: .3, t1: 2.4, k: 'NAV × TOKENS', v: '$672,651,373.82', s: 'against the reported $672,651,375. Implied NAV 11.2932 on every network.', col: C.pass }] },
  { t0: 8.6, t1: 12.0, img: 'ustb-top', cam: [[0, 1007, 1000, 480]], hl: [{ t0: .3, t1: 3.3, box: [831, 599, 352, 786], col: C.hold }],
    co: [{ t0: .3, t1: 3.3, k: 'CANNOT CHECK', v: 'The audit', s: 'Book-entry shares (about 30% of the fund) and custody of the bills are named as unchecked.', col: C.hold }] },
  ], [[TN, C.pass, 3.2, 6.0]], [['USTB reconciles exactly. Reckon also lists what it cannot see.', .4, 11.6]]) };
// 07 | BUIDL
S.s07 = { draw: segShot([{ t0: 0, t1: 4.8, img: 'buidl-issuer', cam: [[0, 400, 132, 800]], hl: [{ t0: .3, t1: 4.6, box: [0, 0, 1088, 90], col: C.hold }],
  co: [{ t0: .3, t1: 2.5, k: 'BLACKROCK BUIDL', v: 'Cannot check', s: 'No official issuer data page to reconcile supply with, and the row says so.', col: C.hold },
       { t0: 2.6, t1: 4.7, k: 'STILL CHECKED', v: 'Mint · filings · entities', s: '7 established. Newest SEC filing 2026-07-27; 2 names screened, no match.', col: C.pass }] }],
  [], [['It says so instead of passing.', .5, 4.4]]) };
// 08 | USDY flagged
S.s08 = { draw: segShot([
